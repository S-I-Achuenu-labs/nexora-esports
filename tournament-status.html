<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA Esports | Tournament Status</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #0b0b0b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
}

.card {
    width: 100%;
    max-width: 600px;
    padding: 40px 25px;
    background: #151515;
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 20px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.logo span {
    color: #d4af37;
}

.icon {
    font-size: 55px;
    margin-bottom: 15px;
}

h1 {
    font-size: clamp(28px, 7vw, 45px);
    margin-bottom: 12px;
}

p {
    color: #a5a5a5;
    line-height: 1.7;
}

.status {
    display: inline-block;
    margin: 25px 0;
    padding: 8px 15px;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 30px;
    color: #f5d97a;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
}

.back {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 20px;
    border: 1px solid #d4af37;
    border-radius: 9px;
    color: #f5d97a;
    text-decoration: none;
    font-weight: 800;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
NEX<span>ORA</span>
</div>

<div class="icon">🏆</div>

<h1>NO TOURNAMENT AVAILABLE</h1>

<div class="status">
CURRENTLY INACTIVE
</div>

<p>
There is currently no active tournament available.
Check back soon for the next NEXORA event.
</p>

<p style="margin-top:15px;">
Tournament announcements will be posted through our
official community channels.
</p>

<a href="index.html" class="back">
← BACK TO NEXORA
</a>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NEXORA — Update Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#0B0B0B;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:90%;
  max-width:420px;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  padding:28px;
}

.logo{
  text-align:center;
  color:#D4AF37;
  font-size:26px;
  font-weight:bold;
  margin-bottom:25px;
}

h1{
  font-size:23px;
  margin-bottom:8px;
}

.subtitle{
  color:#999;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#ccc;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:17px;
  background:#0B0B0B;
  color:white;
  border:1px solid #333;
  border-radius:8px;
  outline:none;
}

input:focus{
  border-color:#D4AF37;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#D4AF37;
  color:#0B0B0B;
  font-weight:bold;
  cursor:pointer;
}

#message{
  margin-top:15px;
  text-align:center;
  color:#aaa;
  font-size:14px;
}

/* LOADING */

#loadingOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0B0B0B;
  z-index:99999;
  align-items:center;
  justify-content:center;
}

.spinner{
  width:75px;
  height:75px;
  border:7px solid #222;
  border-top:7px solid #D4AF37;
  border-right:7px solid #D4AF37;
  border-radius:50%;
  animation:nexoraSpin 0.7s linear infinite;
}

@keyframes nexoraSpin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
</div>

<div class="container">

  <div class="card">

    <div class="logo">
      NEXORA
    </div>

    <h1>Set New Password</h1>

    <p class="subtitle">
      Create a new password for your NEXORA account.
    </p>

    <form id="passwordForm">

      <label for="password">
        New Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        minlength="6"
        required
      >

      <button type="submit">
        UPDATE PASSWORD
      </button>

    </form>

    <div id="message"></div>

  </div>

</div>

<script>

const db = supabase.createClient(
  "https://ltfztvhxxtyptqyratcb.supabase.co",
  "sb_publishable_XmtZcHggM7mA4jW-GNA6_w_cF6hQ5GD"
);

const loadingOverlay =
  document.getElementById("loadingOverlay");

function showLoading(){
  loadingOverlay.style.display = "flex";
}

function hideLoading(){
  loadingOverlay.style.display = "none";
}

const form =
  document.getElementById("passwordForm");

const message =
  document.getElementById("message");

form.onsubmit = async (e) => {

  e.preventDefault();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if(password !== confirmPassword){

    message.textContent =
      "Passwords do not match.";

    return;
  }

  if(password.length < 6){

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }

  showLoading();

  const { error } =
    await db.auth.updateUser({
      password: password
    });

  hideLoading();

  if(error){

    message.textContent =
      error.message;

    return;
  }

  message.textContent =
    "Password updated successfully.";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 1200);

};

</script>

</body>
</html>
